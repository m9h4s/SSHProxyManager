name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore windows/SSHProxyManager.csproj

    - name: Publish Windows App
      run: dotnet publish windows/SSHProxyManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish_windows

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SSHProxyManager-Win-x64
        path: publish_windows/SSHProxyManager.exe
